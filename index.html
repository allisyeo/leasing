oup"><label>Комментарий оценщика</label><textarea class="textarea" data-assessment-comment required placeholder="Опишите состояние, повреждения и рекомендации"></textarea></div></div><div class="assessment-form-foot"><button class="btn primary" type="submit">Отправить результаты оценки</button></div></form></main>`}function assessmentPartModal(key,name,button){const current=(state.assessmentParts||{})[key]||{score:'',comment:''};document.querySelector('#modal').innerHTML=`<div class="overlay"><div class="modal" style="width:min(480px,100%)"><div class="mhead"><div><h2>${esc(name)}</h2><small style="color:var(--muted)">Оценка детали автомобиля</small></div><button class="close" data-part-close>×</button></div><div class="mbody"><div class="form-group"><label>Балловая оценка</label><select class="field" data-part-score><option value="">Выберите балл</option>${['80','90','100','120','130','180','230'].map(v=>`<option value="${v}" ${String(current.score)===v?'selected':''}>${v} баллов</option>`).join('')}</select></div><div class="form-group"><label>Комментарий проверяющего</label><textarea class="textarea" data-part-comment placeholder="Опишите состояние и обнаруженные повреждения">${esc(current.comment)}</textarea></div></div><div class="mfoot"><button class="btn" data-part-close>Отмена</button><button class="btn primary" data-part-save>Сохранить оценку</button></div></div></div>`;const root=document.querySelector('#modal');root.querySelectorAll('[data-part-close]').forEach(b=>b.onclick=()=>root.innerHTML='');root.querySelector('[data-part-save]').onclick=()=>{const score=root.querySelector('[data-part-score]').value;if(!score){toast('Выберите балловую оценку');return}state.assessmentParts=state.assessmentParts||{};state.assessmentParts[key]={name,score,comment:root.querySelector('[data-part-comment]').value.trim()};button.classList.add('checked');button.setAttribute('aria-label',`${name}: ${score} баллов`);document.querySelector('[data-parts-progress]').textContent=`${Object.keys(state.assessmentParts).length} деталей оценено`;root.innerHTML='';toast('Оценка детали сохранена')}}function bindAssessmentPortal(id){const form=document.querySelector('[data-assessment-form]');if(!form)return;state.assessmentParts={};const selected={};form.querySelectorAll('[data-car-part]').forEach(button=>button.addEventListener('click',()=>assessmentPartModal(button.dataset.carPart,button.dataset.partName,button))); form.querySelectorAll('[data-assessment-file]').forEach(input=>input.addEventListener('change',async e=>{const key=input.dataset.assessmentFile;selected[key]=await readSelectedFiles(e.target.files);form.querySelector(`[data-file-label="${key}"]`).textContent=selected[key].map(f=>f.name).join(', ')||'Файлы не выбраны'}));form.addEventListener('submit',e=>{e.preventDefault();if(!selected.act?.length||!selected.exterior?.length||!selected.interior?.length){toast('Загрузите акт и фотографии автомобиля');return}const x=data.find(a=>a.id===id);x.assessmentSubmission={company:form.querySelector('[data-assessment-company]').value.trim(),expert:form.querySelector('[data-assessment-expert]').value.trim(),inspectionDate:form.querySelector('[data-assessment-date]').value,assessedValue:form.querySelector('[data-assessment-value]').value,conclusion:form.querySelector('[data-assessment-conclusion]').value,comment:form.querySelector('[data-assessment-comment]').value.trim(),files:selected,parts:state.assessmentParts||{},submittedAt:'только что'};x.history.push(['Получены оценка, акт и фотографии автомобиля','только что']);save();render();toast('Результаты оценки отправлены')})}function contractAppeals(contract){return data.filter(a=>a.contract===contract)}function currentClientAppeal(contract=state.currentContract||'ДЛ-2025-12480'){return data.find(a=>a.contract===contract&&a.status!=='CLOSED')}function client(){return `<main class="main"><div class="back">‹ &nbsp; Мои заявки</div><button class="outline top-action" data-appeals-list data-contract="ДЛ-2 -resize]');if(resizeHandle){resizeHandle.addEventListener('pointerdown',e=>{e.preventDefault();const chat=document.querySelector('.client-chat');const rect=chat.getBoundingClientRect();const right=rect.right,bottom=rect.bottom;resizeHandle.setPointerCapture(e.pointerId);const move=ev=>{const width=Math.max(300,Math.min(window.innerWidth-30,right-ev.clientX));const height=Math.max(220,Math.min(window.innerHeight-30,bottom-ev.clientY));chat.style.width=`${width}px`;chat.style.height=`${height}px`};const stop=ev=>{resizeHandle.releasePointerCapture?.(ev.pointerId);resizeHandle.removeEventListener('pointermove',move);resizeHandle.removeEventListener('pointerup',stop);resizeHandle.removeEventListener('pointercancel',stop)};resizeHandle.addEventListener('pointermove',move);resizeHandle.addEventListener('pointerup',stop);resizeHandle.addEventListener('pointercancel',stop)})}document.querySelector('[data-client-attach]')?.addEventListener('click',()=>document.querySelector('[data-client-files]').click());document.querySelector('[data-client-files]')?.addEventListener('change',async e=>{state.clientFiles=await readSelectedFiles(e.target.files);document.querySelector('[data-client-attach]').textContent=state.clientFiles.length?`📎 ${state.clientFiles.length}`:'📎'});document.querySelector('[data-client-send]')?.addEventListener('click',()=>{const i=document.querySelector('[data-client-message]');const files=state.clientFiles||[];if(!i.value.trim()&&!files.length)return;const x=data.find(a=>a.id===state.selected);x.messages.push({author:x.client,text:i.value.trim(),files,staff:false});state.managerUnread=true;x.history.push([files.length?`Клиент отправил файлы: ${files.map(f=>typeof f==='string'?f:f.name).join(', ')}`:'Клиент отправил сообщение','только что']);state.clientFiles=[];save();render();toast('Сообщение отправлено')});document.querySelector('[data-client-doc]')?.addEventListener('click',()=>{const x=data.find(a=>a.id===state.selected);x.status='IN_PROGRESS';x.history.push(['Клиент загрузил документы','только что']);save();render();toast('Документы загружены')});document.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>{state.selected=r.dataset.open;state.view='detail';render()});document.querySelector('[data-back]')?.addEventListener('click',()=>{state.view='home';render()});document.querySelector('[data-filter]')?.addEventListener('change',e=>{state.filter=e.target.value;render()});document.querySelector('[data-search]')?.addEventListener('input',e=>{state.query=e.target.value;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));document.querySelector('[data-manager-attach]')?.addEventListener('click',()=>document.querySelector('[data-manager-files]').click());document.querySelector('[data-manager-files]')?.addEventListener('change',async e=>{state.managerFiles=await readSelectedFiles(e.target.files);document.querySelector('[data-manager-attach]').textContent=state.managerFiles.length?`📎 ${state.managerFiles.length}`:'📎'});document.querySelector('[data-send]')?.addEventListener('click',()=>{let i=document.querySelector('[data-message]');const files=state.managerFiles||[];if(!i.value.trim()&&!files.length)return;let x=data.find(a=>a.id===state.selected);x.messages.push({author:'Азамат Тажиев',text:i.value.trim(),files,staff:true});state.clientUnread=true;x.history.push([files.length?`Менеджер отправил файлы: ${files.map(f=>typeof f==='string'?f:f.name).join(', ')}`:'Отправлено сообщение клиенту','только что']);state.managerFiles=[];save();render();toast('Сообщение отправлено')})}function render(){const match=location.hash.match(/^#assessment=(.+)$/);if(match){const id=decodeURIComponent(match[1]);document.querySelector('#app').innerHTML=assessmentPortal(id);bindAssessmentPortal(id);return}let c=state.mode==='client'?(state.view==='clientAppeal'?clientAppeal():state.view==='clientAppealsList'?clientAppealsList():client()):state.view==='detail'?managerDetail():managerList();document.querySelector('#app').innerHTML=shell(c);bind()}render()})();
</script></body></html>
